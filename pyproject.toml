[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flip-to-po"
version = "1.0.0"
description = "GenAI purchase-order automation: OCR -> LLM extraction -> validation -> confidence-gated auto-issue (clean-room demo on synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thimabhorn Kaewman" }]
keywords = ["genai", "llm", "ocr", "document-intelligence", "rag", "procurement", "automation"]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
